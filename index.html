<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N unit 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; color-scheme: light only; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one narrow column, a step rail on top; each question is a ruled row, follow-ups indent under their question. */
:root {
  --bg: #f1f2f4;
  --paper: #ffffff;
  --ink: #1b1d22;
  --muted: #646a75;
  --rule: #d9dce2;
  --soft: #e7e9ed;
  --c-self: #e2553c;   /* 개인 · 점 */
  --c-other: #c98a12;  /* 개인과 타인 · 선 */
  --c-env: #2f9a5e;    /* 개인과 환경 · 면 */
  --accent: var(--c-self);
  --no: #d23b3b;      /* 부정 · '그렇지 않다' 쪽 */
  --yes: #2f62d0;     /* 긍정 · '그렇다' 쪽 */
  --warn: #c23a2b;
  --miss: #fff6d1;    /* 답하지 않은 질문 칸 */
  --done: #1f9d55;    /* 답한 막대 손잡이 */
  --f-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header.top { display: flex; flex-direction: column; gap: 10px; }
.brand { font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 7vw, 44px); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.lede { margin: 0; color: var(--ink); font-size: 17px; font-weight: 500; line-height: 1.55; max-width: 34em; }
.lede b { font-weight: 700; box-shadow: inset 0 -0.42em 0 color-mix(in srgb, var(--yes) 22%, transparent); }

/* step rail */
.rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rail .seg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rail .bar { height: 4px; border-radius: 2px; background: var(--soft); }
.rail .seg.past .bar, .rail .seg.on .bar { background: var(--seg); }
.rail .lbl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .seg.on .lbl { color: var(--ink); font-weight: 600; }

/* section head */
.page-head { font-family: var(--f-mono); font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.qhint { margin: -6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.intro { display: flex; flex-direction: column; gap: 16px; }
.about { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.about h2 { margin: 0; font-size: 18px; font-weight: 700; }
.about p { margin: 0; line-height: 1.65; }
.facts { margin: 4px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.agree { display: flex; gap: 10px; align-items: center; font-weight: 600; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); cursor: pointer; margin-top: 4px; transition: background-color .25s ease; }
.agree input { width: 20px; height: 20px; accent-color: var(--ink); flex: none; }
.agree.missing { background: var(--miss); }
.lede-in { margin: 0; font-size: 16px; line-height: 1.55; }
.lede-in b { font-weight: 700; box-shadow: inset 0 -0.42em 0 color-mix(in srgb, var(--yes) 22%, transparent); }
@media (max-width: 520px) { .about { padding: 16px; } .facts { grid-template-columns: 1fr; gap: 0 0; } .facts dd { margin-bottom: 8px; } }
.sec-head { display: flex; align-items: center; gap: 14px; }
.sec-head svg { flex: none; width: 44px; height: 44px; }
.sec-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; margin: 0; line-height: 1.2; }
.sec-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.qlist { display: flex; flex-direction: column; background: var(--paper); border-radius: 14px; border: 1px solid var(--rule); overflow: hidden; }
.q { padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--rule); }
.q:first-child { border-top: 0; }
.q .num { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: .04em; }
.q .text { font-size: 17px; font-weight: 600; line-height: 1.5; margin: 0; text-wrap: pretty; }
.q { transition: background-color .25s ease; }
.q.missing { background: var(--miss); }
/* 집중 모드: 지금 질문만 또렷하게, 나머지는 흐리게 */
.qlist.focusable { overflow: visible; background: transparent; border: 0; gap: 14px; padding: 0 6px; }
.qlist.focusable > .q { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; opacity: .45; filter: blur(1.6px) saturate(.4); transform: scale(.96);
  transition: opacity .3s ease, filter .3s ease, transform .3s ease, box-shadow .3s ease, border-color .3s ease, background-color .25s ease; }
.qlist.focusable > .q:first-child { border-top: 1px solid var(--rule); }
.qlist.focusable > .q.focus { opacity: 1; filter: none; transform: scale(1.02); border: 2px solid var(--ink); box-shadow: 0 14px 36px rgb(0 0 0 / .14); position: relative; z-index: 1; }
.qlist.focusable > .q.missing { opacity: 1; filter: none; background: var(--miss); }
.end-space { height: 32vh; }
.q.paired.reveal { animation: drop .35s ease-out; }
.qlist.focusable > .q.paired { margin-top: -6px; border-top: 3px solid var(--rule); }
@media (prefers-reduced-motion: reduce) { .qlist.focusable > .q { transition: none; transform: none; } }
/* 답한 질문 표시 */
.q .num { display: flex; align-items: center; gap: 8px; }
.q.answered .num::after { content: "✓ 답함"; font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: 0; color: #fff; background: var(--done); padding: 2px 8px; border-radius: 999px; }

.q.missing .fu { background: transparent; }

.fu { margin-left: 4px; padding: 16px 0 2px 16px; border-left: 3px solid var(--accent); display: flex; flex-direction: column; gap: 12px; animation: drop .28s ease-out; }
.fu .tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--accent); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fu { animation: none; } }

/* spectrum */
.spec { display: flex; flex-direction: column; gap: 6px; }
.spec input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; touch-action: pan-y; }
.spec input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--no), var(--soft) 50%, var(--yes)); }
.spec input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--no), var(--soft) 50%, var(--yes)); }
.spec input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--paper); border: 7px solid var(--done); box-shadow: 0 0 0 5px color-mix(in srgb, var(--done) 25%, transparent); }
.spec input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 7px solid var(--done); box-shadow: 0 0 0 5px color-mix(in srgb, var(--done) 25%, transparent); }
.spec.untouched input[type=range]::-webkit-slider-thumb { border: 3px solid var(--muted); background: var(--soft); box-shadow: none; }
.spec.untouched input[type=range]::-moz-range-thumb { border: 3px solid var(--muted); background: var(--soft); box-shadow: none; width: 20px; height: 20px; }
.spec .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.spec .hint { font-size: 12px; color: var(--muted); }
.spec .now { font-size: 19px; font-weight: 600; min-height: 1.5em; color: var(--muted); }
.spec .now[data-band="0"], .spec .now[data-band="1"] { color: var(--no); }
.spec .now[data-band="3"], .spec .now[data-band="4"] { color: var(--yes); }
.spec.untouched .now { font-size: 14px; font-weight: 500; color: var(--muted); }
.ticks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 12px; line-height: 1.3; word-break: keep-all; }
.ticks span { text-align: center; color: var(--muted); }
.ticks span:first-child { text-align: left; }
.ticks span:last-child { text-align: right; }
.ticks .t0, .ticks .t1 { color: var(--no); }
.ticks .t3, .ticks .t4 { color: var(--yes); }
.ticks .t0, .ticks .t4 { font-size: 14px; font-weight: 700; }

/* choices */
.choices { display: grid; gap: 6px; }
.choices.five { grid-template-columns: repeat(5, 1fr); }
.choices.three { grid-template-columns: repeat(3, 1fr); }
.choices button {
  font-family: var(--f-body); font-size: 13px; font-weight: 600; line-height: 1.3; padding: 12px 4px; min-height: 52px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); cursor: pointer;
  word-break: keep-all;
}
.choices button:hover { border-color: var(--ink); }
.choices button[data-side="no"] { color: var(--no); }
.choices button[data-side="yes"] { color: var(--yes); }
.choices button[data-side="yes"]:hover { border-color: var(--yes); }
.choices button[data-side="no"]:hover { border-color: var(--no); }
.choices button[aria-pressed="true"] { background: var(--yes); border-color: var(--yes); color: var(--paper); font-weight: 700; }
.choices button[data-side="no"][aria-pressed="true"] { background: var(--no); border-color: var(--no); }
.choices button[data-side="mid"][aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.choices.three.has-skip { grid-template-columns: repeat(4, 1fr); }
.choices button.skip { color: var(--muted); background: var(--soft); border-color: var(--muted); }
.choices button.skip:hover { border-color: var(--ink); color: var(--ink); }
.choices button.skip[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--paper); }

/* number inputs */
.numrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.numrow input[type=number] { font: inherit; width: 120px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
.money-out { font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; }

/* text inputs */
.field { display: flex; flex-direction: column; gap: 8px; }
.field input[type=text] { font: inherit; font-size: 20px; letter-spacing: .12em; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
.field small { color: var(--muted); font-size: 13px; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.nav { display: flex; justify-content: space-between; gap: 10px; }
.btn { font: inherit; font-weight: 600; padding: 14px 22px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); margin-left: auto; }
.btn:disabled { opacity: .5; cursor: default; }

.done { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 32px 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.done .shapes { display: flex; gap: 10px; }
.done h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 0; }
.done p { margin: 0; color: var(--muted); }
.code { font-family: var(--f-mono); font-size: 14px; padding: 4px 10px; background: var(--soft); border-radius: 6px; color: var(--ink); }
.status { font-size: 13px; }
.status.bad { color: var(--warn); }
.admin { display: flex; flex-direction: column; gap: 16px; }
.admin h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; margin: 0; }
.admin .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.admin .bar .count { margin-right: auto; color: var(--muted); }
.tablewrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; }
table.resp { border-collapse: collapse; font-size: 13px; min-width: 100%; }
table.resp th, table.resp td { border: 1px solid var(--rule); padding: 8px 10px; text-align: center; vertical-align: middle; white-space: nowrap; }
table.resp th { position: sticky; top: 0; z-index: 1; background: var(--soft); font-weight: 600; font-size: 12px; }
table.resp th.fu { background: #fbe9c8; color: #6b4a08; }
table.resp th.sum { background: #dceee3; color: #1d4d31; }
table.resp td.sum { background: color-mix(in srgb, #dceee3 40%, var(--paper)); }
table.resp .big { display: block; font-family: var(--f-mono); font-size: 18px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
table.resp .small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
table.resp td.none { color: var(--muted); }
.who { font: inherit; font-weight: 700; color: var(--yes); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.drawer-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .28); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100%); background: var(--bg); z-index: 41; overflow-y: auto;
  box-shadow: -12px 0 40px rgb(0 0 0 / .18); padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 18px;
  display: flex; flex-direction: column; gap: 18px; }
.drawer-head { display: flex; align-items: flex-start; gap: 10px; }
.drawer-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 24px; margin: 0; }
.drawer-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.drawer-head .btn { margin-left: auto; padding: 8px 14px; }
.unit { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.unit-title { display: flex; align-items: center; gap: 8px; }
.unit-title h3 { margin: 0; font-size: 16px; font-weight: 700; }
.unit-title .tag { font-size: 12px; color: var(--muted); }
.unit-figs { display: flex; flex-wrap: wrap; gap: 10px; }
.unit-figs figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.unit-figs figcaption { font-size: 11px; color: var(--muted); }
.unit-figs svg { display: block; background: var(--bg); border-radius: 10px; max-width: 100%; height: auto; }
.unit .note { font-size: 12px; color: var(--muted); margin: 0; }
.unit-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 720px) { .unit-pair { grid-template-columns: minmax(0, 1fr); } }
.v3 { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.v3 canvas { width: 100%; height: 260px; display: block; background: var(--bg); border-radius: 10px; }
.v3 svg { background: var(--bg); border-radius: 10px; }
.v3 figcaption { font-size: 11px; color: var(--muted); text-align: center; }
.line-views { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; }
.line-views figure { margin: 0; display: flex; flex-direction: column; gap: 4px; background: var(--bg); border-radius: 10px; padding: 6px; }
.line-views figcaption, .unit-figs figcaption { font-size: 11px; color: var(--muted); text-align: center; }
.views { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.vbtn { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.vbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.v3 canvas { height: auto !important; min-height: 280px; touch-action: none; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.counts div { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.counts b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
.counts span { font-size: 12px; color: var(--muted); }
.vals { width: 100%; border-collapse: collapse; font-size: 13px; }
.vals th, .vals td { border-bottom: 1px solid var(--rule); padding: 7px 6px; text-align: center; vertical-align: middle; }
.vals th { font-size: 11px; color: var(--muted); font-weight: 600; }
.vals td.l { text-align: left; }
.vals .n { font-family: var(--f-mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.vals .s { display: block; font-size: 11px; color: var(--muted); }
.vals tr.furow td { color: var(--muted); background: color-mix(in srgb, #fbe9c8 35%, transparent); }
.vals .avg { font-family: var(--f-mono); font-weight: 700; }
.empty { padding: 28px 18px; color: var(--muted); }
.vtabs { display: inline-flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px; width: max-content; }
.vtab { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.vtab[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
#dist-view { display: flex; flex-direction: column; gap: 18px; }
#dist-view[hidden] { display: none; }
.dist-note { margin: 0; }
.dsec { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.dsub { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.drow { display: flex; flex-direction: column; gap: 0; padding-top: 6px; }
.drow.dfu { margin-left: 22px; padding-left: 10px; border-left: 3px solid #fbe9c8; }
.drow.empty-fu { opacity: .6; padding-bottom: 6px; }
.dq { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.dn { font-family: var(--f-mono); font-size: 12px; color: var(--muted); flex: none; min-width: 3.4em; }
.dt { flex: 1; min-width: 0; font-weight: 600; }
.drow.dfu .dt { font-weight: 500; color: var(--muted); }
.dc { flex: none; font-size: 12px; color: var(--muted); }
circle.dd { cursor: pointer; }
circle.dd:hover { stroke: var(--ink); stroke-width: 2; }
.linkbtn { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* ---------- 휴대폰 ---------- */
@media (max-width: 520px) {
  body { font-size: 15px; padding-block: 18px 0; }
  .wrap { gap: 20px; }
  header.top { gap: 6px; }
  .brand { font-size: 11px; }
  h1 { font-size: 27px; }
  .lede { font-size: 16px; line-height: 1.55; }
  .rail { gap: 4px; }
  .rail .lbl { font-size: 11px; }

  .sec-head { gap: 10px; }
  .sec-head svg { width: 34px; height: 34px; }
  .sec-head h2 { font-size: 22px; }
  .sec-head p { font-size: 13px; }

  .qlist { border-radius: 12px; }
  .q { padding: 18px 16px 20px; gap: 12px; }
  .q .text { font-size: 16px; line-height: 1.5; }

  .fu { margin-left: 0; padding: 14px 0 2px 12px; gap: 10px; }

  /* 막대: 손가락으로 잡기 쉽게 크게 */
  .spec input[type=range] { height: 36px; }
  .spec input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; }
  .spec input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; }
  .spec input[type=range]::-webkit-slider-thumb { width: 34px; height: 34px; margin-top: -13px; }
  .qlist.focusable { gap: 8px; }
  .qlist.focusable > .q { border-radius: 12px; }
  .spec input[type=range]::-moz-range-thumb { width: 24px; height: 24px; }
  .spec .now { font-size: 18px; }
  /* 눈금은 양 끝과 가운데만, 지금 단계는 막대 위 글자가 알려 줌 */
  .ticks { grid-template-columns: 1fr auto 1fr; font-size: 12px; }
  .ticks .t1, .ticks .t3 { display: none; }

  const isPaired = x => { const j = pgIds.indexOf(x); return j > 0 && pgIds[j - 1].startsWith("open:"); };
  const main = pgIds.filter(x => !isPaired(x)), mi = main.indexOf(id);
  const num = isPaired(id) ? `<div class="num">이어지는 질문</div>`
    : `<div class="num">${String(mi + 1).padStart(2, "0")} / ${String(main.length).padStart(2, "0")}</div>`;
  if (id.startsWith("open:")) {
    const k = id.slice(5), o = OPENQ[k];
    return `<div class="q write" id="q_${k}">${num}

        <small>초성만 입력돼요. 제출하면 초성 순서가 무작위로 섞여서 저장되기 때문에, 제작진이 볼 때는 원래 무슨 말인지 알 수 없어요. 편하게 적어 주세요.</small>
      </div></div>`;
  }
  const q = findQ(id), open = isExtreme(q.type, A[q.id]);
  const pg = PAGES[step], prev = pg && pg.ids ? pg.ids[pg.ids.indexOf(id) - 1] : null;
  const gate = prev && prev.startsWith("open:") ? prev.slice(5) : "";
  return `<div class="q${gate ? " paired" : ""}" id="q_${q.id}"${gate ? ` data-gate="${gate}"${OPEN[gate].trim() ? "" : " hidden"}` : ""}>${num}
    <p class="text">${q.text}</p>${q.hint ? `<p class="qhint">${q.hint}</p>` : ""}
    ${controlHTML(q.id, q.type)}
    ${open ? `<div class="fu" id="q_${q.id}__fu"><div class="tag">질문 하나 더</div><p class="text">${q.fu.text}</p>${controlHTML(q.id + "__fu", q.fu.type)}</div>` : ""}
  </div>`;
}

function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function band(v) { return Math.min(4, Math.floor(v / 20)); }
function cfg(id) { const q = findQ(id); return id.endsWith("__fu") ? q.fu : q; }
function findQ(id) {
  const base = id.replace(/__fu$/, "");
  for (const s of SECTIONS) for (const q of (s.qs || [])) if (q.id === base) return q;
}

function refreshQuestion(baseId) {
  const pg = PAGES[step], q = findQ(baseId), i = pg.ids.indexOf(baseId);
  const el = document.getElementById("q_" + baseId);
  const wasOpen = !!document.getElementById("q_" + baseId + "__fu");
  const open = isExtreme(q.type, A[q.id]);
  if (!open) delete A[q.id + "__fu"];
  if (wasOpen === open) return false;
  const tmp = document.createElement("div");
  tmp.innerHTML = qBlock(baseId, i, pg.ids.length);
  const nu = tmp.firstElementChild;
  if (el.classList.contains("focus")) nu.classList.add("focus");
  el.replaceWith(nu);
  if (FOCUSED === el) FOCUSED = nu;
  return true;
}

// interactions (delegated)
const stageEl = document.getElementById("stage");
function onRange(e) {
  const t = e.target;
  if (t.type !== "range") return;
  const id = t.dataset.id;
  const v = Number(t.value);
  if (t.dataset.dur) {
    A[id] = { score: v, label: fmtDur(v) };
    const out = document.getElementById("out_" + id); if (out) out.textContent = fmtDur(v);
  } else if (t.dataset.money) {
    A[id] = { value: v, label: fmtMoney(v) };
    const out = document.getElementById("out_" + id); if (out) out.textContent = fmtMoney(v);
  } else if (t.dataset.ppl) {
    A[id] = { value: v, score: v, label: v >= 100 ? "100명 이상" : v + "명" };
    const out = document.getElementById("out_" + id); if (out) out.textContent = v >= 100 ? "100명 이상" : v + "명";
  } else {
    const ticks = cfg(id).ticks || FIVE;
    A[id] = { score: v, label: ticks[band(v)] };
  }
  t.closest(".spec").classList.remove("untouched");
  const hint = t.closest(".spec").querySelector(".hint"); if (hint) hint.remove();
  t.closest(".q")?.classList.remove("missing");
  if (!id.endsWith("__fu") && e.type === "change") {
    const focusId = t.id;
    if (refreshQuestion(id)) document.getElementById(focusId)?.focus({ preventScroll: true });
  }
  refreshMarks();
}
stageEl.addEventListener("input", e => {
  if (e.target.type === "range") onRange(e);
});
stageEl.addEventListener("change", e => { if (e.target.type === "range") onRange(e); });
// 손잡이를 누르기만 하고 움직이지 않았을 때(보통이다를 고르려는 경우)도 답으로 인정
let rangeDown = null;
stageEl.addEventListener("pointerdown", e => { if (e.target.type === "range") rangeDown = { el: e.target, x: e.clientX, y: e.clientY }; });
stageEl.addEventListener("pointerup", e => {
  const d = rangeDown; rangeDown = null;
  if (!d || e.target !== d.el || A[d.el.dataset.id]) return;
  if (Math.abs(e.clientY - d.y) > 8) return;           // 세로로 밀었으면 스크롤이지 답이 아님
  onRange({ target: d.el, type: "change" });
});
stageEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-idx]");
  if (!b) return;
  const id = b.dataset.id, type = b.dataset.type;
  if (b.dataset.idx === "skip") {
    A[id] = { idx: -1, score: null, label: b.textContent, skip: true };
  } else {
    const idx = Number(b.dataset.idx);
    const score = type === "five" ? idx * 25 : idx * 50;
    A[id] = { idx, score, label: b.textContent };
  }
  b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  b.closest(".q")?.classList.remove("missing");
  const baseId = id.replace(/__fu$/, "");
  if (!id.endsWith("__fu")) { if (refreshQuestion(id)) document.getElementById(b.id)?.focus({ preventScroll: true }); }
  refreshMarks();
});

// ---------- 지금 답하는 질문만 또렷하게 ----------
function isDone(id) {
  if (id.startsWith("open:")) return !!OPEN[id.slice(5)].trim();
  const q = findQ(id); if (!q) return false;
  const a = A[q.id]; if (!a) return false;
  return !isExtreme(q.type, a) || !!A[q.id + "__fu"];
}
function qEl(id) { return document.getElementById("q_" + (id.startsWith("open:") ? id.slice(5) : id)); }
function refreshMarks() {
  const pg = PAGES[step]; if (!pg || !pg.ids) return;
  // 주관식에 답하면 짝이 되는 질문이 나타남
  document.querySelectorAll("#stage .q[data-gate]").forEach(el => {
    const show = !!OPEN[el.dataset.gate].trim();
    if (show && el.hidden) { el.hidden = false; el.classList.add("reveal"); }
    else if (!show && !el.hidden) { el.hidden = true; }
  });
  pg.ids.forEach(id => { const el = qEl(id); if (el) el.classList.toggle("answered", isDone(id)); });
}
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
function navH() { const n = document.getElementById("nav"); return n && getComputedStyle(n).position === "sticky" ? n.offsetHeight : 0; }
let FOCUSED = null, lockUntil = 0;
function setFocus(el) {
  const list = document.querySelector("#stage .qlist.focusable"); if (!list) return;
  list.querySelectorAll(":scope > .q").forEach(q => q.classList.toggle("focus", q === el));
  FOCUSED = el; lockUntil = Date.now() + 350; clearTimeout(pickByScroll.t);
}
function pickByScroll() {
  if (Date.now() < lockUntil) { clearTimeout(pickByScroll.t); pickByScroll.t = setTimeout(pickByScroll, lockUntil - Date.now() + 30); return; }
  const list = document.querySelector("#stage .qlist.focusable"); if (!list) return;
  const mid = (innerHeight - navH()) / 2; let best = null, bd = 1e9;
  let dCur = 1e9;
  list.querySelectorAll(":scope > .q:not([hidden])").forEach(q => { const r = q.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid); if (q === FOCUSED) dCur = d; if (d < bd) { bd = d; best = q; } });
  // 지금 질문보다 확실히 더 가운데에 가까울 때만 바꿔요 (떨림 방지)
  if (best && best !== FOCUSED && bd < dCur - 40) setFocus(best), lockUntil = 0;
}
let scrollRaf = 0;
addEventListener("scroll", () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; pickByScroll(); }); }, { passive: true });
addEventListener("resize", () => { const a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.type !== "range") return; pickByScroll(); });
// 흐린 질문을 누르면 그 질문이 가운데로 오며 또렷해짐
stageEl.addEventListener("pointerdown", e => {
  const q = e.target.closest("#stage .qlist.focusable > .q"); if (!q || q === FOCUSED) return;
  setFocus(q);
}, true);
stageEl.addEventListener("focusin", e => {
  const q = e.target.closest("#stage .qlist.focusable > .q"); if (q && q !== FOCUSED) setFocus(q);
});

function validate() {
  const pg = PAGES[step];
  let first = null;
  const mark = (el, bad) => { el.classList.toggle("missing", bad); if (bad && !first) first = el; };
  if (pg.key === "intro") {
    mark(document.getElementById("q_agree"), !AGREE);
    mark(document.getElementById("q_nick"), !OPEN.nick.trim());
  } else {
    for (const id of pg.ids) {
      if (id.startsWith("open:")) { const k = id.slice(5); mark(document.getElementById("q_" + k), !OPEN[k].trim()); continue; }
      const q = findQ(id), el = document.getElementById("q_" + q.id);
      if (el.hidden) continue;
      mark(el, !A[q.id] || (isExtreme(q.type, A[q.id]) && !A[q.id + "__fu"]));
    }
  }
  if (first) { if (first.closest(".qlist.focusable")) setFocus(first); first.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "center" }); }
  return !first;
}

document.getElementById("prev").addEventListener("click", () => { if (step > 0) { step--; renderStage(); window.scrollTo(0, 0); } });
document.getElementById("next").addEventListener("click", async () => {
  if (!validate()) return;
  if (step < PAGES.length - 1) { step++; renderStage(); window.scrollTo(0, 0); return; }
  await submit();
});

function buildRows() {
  const rows = [];
  for (const s of SECTIONS) for (const q of (s.qs || [])) {
    const a = A[q.id];
    rows.push({ section: s.name, item: q.item, id: q.id, question: q.text, followup: false, answer: a.label, score: a.score });
    const f = A[q.id + "__fu"];
    if (f) rows.push({ section: s.name, item: q.item, id: q.id + "__fu", question: q.fu.text, followup: true,
      answer: f.label, score: f.score ?? null, value: f.value ?? null });
  }
  return rows;
}


// ---------- Firebase ----------
// Firebase가 막힌 환경(클로드 미리보기 등)에서는 테스트 모드로 화면만 보여줘요
let fdb = null, fauth = null, FB_OK = false;
try {
  if (typeof firebase !== "undefined") {
    firebase.initializeApp(FIREBASE_CONFIG);
    fdb = firebase.firestore();
    fauth = firebase.auth();
    FB_OK = true;
  }
} catch (e) { console.warn("Firebase 사용 불가 → 테스트 모드", e); }

// 초성 순서를 무작위로 섞음 (띄어쓰기 자리는 그대로)
function shuffleCho(t) {
  const s = String(t).trim(), letters = [...s].filter(c => c !== " ");
  for (let i = letters.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [letters[i], letters[j]] = [letters[j], letters[i]]; }
  let k = 0; return [...s].map(c => c === " " ? " " : letters[k++]).join("");
}
async function submit() {
  const btn = document.getElementById("next");
  btn.disabled = true; btn.textContent = "저장하는 중";
  const code = Math.random().toString(36).slice(2, 8).toUpperCase();
  const payload = { code, createdAt: new Date().toISOString(), savedAt: FB_OK ? firebase.firestore.FieldValue.serverTimestamp() : null,
    nickname: OPEN.nick.trim(), open: { taste: shuffleCho(OPEN.taste), habit: shuffleCho(OPEN.habit), person: shuffleCho(OPEN.person) }, rows: buildRows() };
  try {
    if (FB_OK) await fdb.collection("responses").doc(code).set(payload);
  } catch (e) {
    btn.disabled = false; btn.textContent = "다시 제출하기";
    showStatus("답변을 저장하지 못했어요. 인터넷 연결을 확인하고 다시 제출해 주세요.");
    return;
  }
  btn.disabled = false;
  step = PAGES.length;
  renderRail();
  document.getElementById("nav").hidden = true;
  document.getElementById("stage").innerHTML = `
    <div class="done">
      <div class="shapes">${shapeSVG("dot", "--c-self", 36)}${shapeSVG("line", "--c-other", 36)}${shapeSVG("plane", "--c-env", 36)}</div>
      <h2>답해 주셔서 고마워요</h2>
      <p>방금 고른 답들이 점, 선, 면이 되어 당신의 유닛을 만들어요.</p>
      <p>응답 번호 <span class="code">${code}</span></p>
      <p class="status">${FB_OK ? "답변이 저장되었어요." : "테스트 화면이라 답변은 저장되지 않았어요."}</p>
      <button class="btn" id="again" type="button">새로 시작하기</button>
    </div>`;
  document.getElementById("again").addEventListener("click", () => {
    A = {}; OPEN = { nick: "", habit: "", taste: "", person: "" }; AGREE = false; step = 0; renderStage(); window.scrollTo(0, 0);
  });
}
function showStatus(msg) {
  let el = document.getElementById("submit-status");
  if (!el) { el = document.createElement("p"); el.id = "submit-status"; el.className = "status bad"; document.getElementById("nav").before(el); }
  el.textContent = msg;
}

// ---------- 응답 모아 보기 (제작팀: 구글 로그인) ----------
let RESP = [];
function columns() {
  const cols = [];
  for (const s of SECTIONS) (s.qs || []).forEach((q, i) => {
    const name = `${s.name} ${i + 1}번`;
    cols.push({ id: q.id, head: name, title: q.text, fu: false });
    cols.push({ id: q.id + "__fu", head: name + " 추가", title: q.fu.text, fu: true });
  });
  return cols;
}
function cfgType(id) { const q = findQ(id); if (!q) return ""; return id.endsWith("__fu") ? q.fu.type : q.type; }
function isNumeric(id) { return ["spec", "duration", "money", "people"].includes(cfgType(id)); }
const ITEMS = ["강도", "지속성", "수용 태도", "가시성"];
function summaryCols() {
  const out = [];
  for (const s of SECTIONS) if (s.qs) for (const it of ITEMS) {
    const ids = s.qs.filter(q => q.item === it).map(q => q.id);
    if (ids.length) out.push({ head: `${s.name} · ${it}`, ids });
  }
  return out;
}
// 기본 질문 점수의 평균 (추가 질문, '연애 경험 없음'은 빼고 계산)
function summaryValue(m, sc) {
  const v = sc.ids.map(id => m[id]?.score).filter(x => typeof x === "number");
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}
// ---------- 응답자 한 명의 유닛 보기 (평면 도식) ----------

      <p class="note">면 그래픽 2는 기본 답을 그대로 쓰고 추가 질문이 열린 항목만 바꿔 만들어요. 통로는 가시성 추가 질문이 열린 행의 모듈이에요.${layers.length && !tunnels.length ? " 이 사람은 가시성 추가 질문이 없어서 면 그래픽 2에 통로가 없어요." : ""}</p>
      ${valsTable(S3, m)}

  </aside>`);
  document.getElementById("drawer-close").addEventListener("click", closePerson);
  document.getElementById("drawer-bg").addEventListener("click", closePerson);
  const T = THREE, viewers = {};
  const fail = (id, e) => { console.error(e); const c = document.getElementById(id); if (c) c.insertAdjacentHTML("afterend", `<p class="note">입체를 그리지 못했어요: ${esc(e.message || String(e))}</p>`); };
  try { const v = makeViewer(document.getElementById("cv-dot"), 280); dots.forEach((u, i) => { const me = buildPoint(T, u.p, i === 0 ? UPAL.point : UPAL.pointSub); me.position.x = i * 46; v.add(me); }); v.fit(PV[0][1]); viewers["cv-dot"] = v; } catch (e) { fail("cv-dot", e); }
  try { const v = makeViewer(document.getElementById("cv-line"), 300); v.add(buildLine(T, L, brs)); v.fit(LV[0][1]); viewers["cv-line"] = v; } catch (e) { fail("cv-line", e); }
  try { const v = makeViewer(document.getElementById("cv-face"), 300); v.add(buildFaceStack(T, F, layers, tunnels)); v.fit(FV[0][1]); viewers["cv-face"] = v; } catch (e) { fail("cv-face", e); }
  document.querySelectorAll("#drawer .views").forEach(box => box.addEventListener("click", e => {

  }));

}
function closePerson() { disposeViewers(); document.getElementById("drawer")?.remove(); document.getElementById("drawer-bg")?.remove(); }

// ---------- 분포로 보기: 질문마다 0~100 선 위에 응답자 한 명 = 점 하나 ----------
let ADMIN_TAB = "dist";
function distScale(cfg, x) {   // 응답 하나를 0~100 위치로
  if (!x) return null;
  if (cfg.type === "money") return x.value == null ? null : clamp((x.value - 10) / 990 * 100, 0, 100);
  if (cfg.type === "people") return x.value ?? x.score ?? null;
  return typeof x.score === "number" ? x.score : null;
}
function distEnds(cfg) {
  if (cfg.type === "duration") return ["0시간 (루틴 없음 포함)", "1년 이상"];
  if (cfg.type === "money") return ["10만 원 이하", "1000만 원 이상"];
  if (cfg.type === "people") return ["0명", "100명 이상"];
  if (cfg.type === "three") return [THREE[0], THREE[2]];
  const t = cfg.ticks || cfg.opts || FIVE; return [t[0], t[t.length - 1]];
}
function distRow(label, text, pts, ends, opts = {}) {
  // pts: [{v, name, code, ans}]
  const W = 660, x0 = 122, x1 = 530, X = v => x0 + (x1 - x0) * v / 100, R = 5.5;
  const placed = [], bins = [];
  pts.slice().sort((a, b) => a.v - b.v).forEach(p => {
    const x = X(p.v); let lvl = 0;
    while (placed.some(q => q.lvl === lvl && Math.abs(q.x - x) < R * 2 + 1)) lvl++;
    placed.push({ ...p, x, lvl });
  });
  const maxLvl = placed.reduce((a, p) => Math.max(a, p.lvl), 0);
  const base = 14 + maxLvl * (R * 2 + 1) + R, H = base + 44;
  const col = v => opts.neutral ? "var(--ink)" : v <= 40 ? "var(--no)" : v >= 60 ? "var(--yes)" : "var(--muted)";
  const mean = pts.length ? pts.reduce((a, p) => a + p.v, 0) / pts.length : null;
  const dots = placed.map(p => `<circle class="dd" data-code="${esc(p.code)}" cx="${p.x.toFixed(1)}" cy="${(base - p.lvl * (R * 2 + 1)).toFixed(1)}" r="${R}" fill="${col(p.v)}" fill-opacity=".85" stroke="var(--paper)" stroke-width="1.2"><title>${esc(p.name)} · ${esc(p.ans)}</title></circle>`).join("");
  const ticks = [0, 25, 50, 75, 100].map(t => `<line x1="${X(t)}" y1="${base + R + 3}" x2="${X(t)}" y2="${base + R + 8}" stroke="var(--rule)" stroke-width="1"/>`).join("");
  return `<div class="drow${opts.fu ? " dfu" : ""}">
    <div class="dq"><span class="dn">${label}</span><span class="dt">${esc(text)}</span><span class="dc">${pts.length}명${opts.extra ? " · " + opts.extra : ""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(text)} 응답 분포">
      <line x1="${x0}" y1="${base + R + 5}" x2="${x1}" y2="${base + R + 5}" stroke="var(--rule)" stroke-width="2" stroke-linecap="round"/>${ticks}
      <text x="${x0 - 8}" y="${base + R + 9}" text-anchor="end" font-size="11" fill="var(--no)">${esc(ends[0])}</text>
      <text x="${x1 + 8}" y="${base + R + 9}" font-size="11" fill="${opts.neutral ? "var(--muted)" : "var(--yes)"}">${esc(ends[1])}</text>
      ${mean == null ? "" : `<path d="M${X(mean).toFixed(1)} ${base + R + 7} l-5 9 h10 z" fill="var(--ink)"/><text x="${X(mean).toFixed(1)}" y="${base + R + 28}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">평균 ${Math.round(mean)}</text>`}
      ${dots}
    </svg></div>`;
}
function distHTML() {
  const byResp = RESP.map(r => ({ r, m: Object.fromEntries((r.rows || []).map(x => [x.id, x])) }));
  let n = 0, html = `<p class="note dist-note">점 하나가 응답자 한 명이에요. 점을 누르면 그 사람의 유닛이 열리고, 점에 마우스를 올리면 닉네임과 답이 보여요. ▲는 평균이에요. 추가 질문은 그 질문이 열린 사람만 찍혀요.</p>`;
  for (const s of SECTIONS) {
    if (!s.qs) continue;
    html += `<section class="dsec"><div class="unit-title">${shapeSVG(s.shape, s.color, 22)}<h3>${s.name}</h3></div>`;
    // 항목별 평균 (기본 질문 평균) 분포
    html += `<div class="dsub">항목별 평균</div>`;
    for (const it of ITEMS) {
      const sc = summaryCols().find(c => c.head === `${s.name} · ${it}`); if (!sc) continue;
      const pts = byResp.map(({ r, m }) => { const v = summaryValue(m, sc); return v == null ? null : { v, name: r.nickname || "(이름 없음)", code: r.code, ans: `평균 ${v}` }; }).filter(Boolean);
      html += distRow(it, `${it} 평균`, pts, ["낮음", "높음"]);
    }
    html += `<div class="dsub">질문별</div>`;
    s.qs.forEach(q => {
      n++;
      const mk = (cfg, id) => byResp.map(({ r, m }) => { const x = m[id]; const v = distScale(cfg, x); return v == null ? null : { v, name: r.nickname || "(이름 없음)", code: r.code, ans: x.answer }; }).filter(Boolean);
      const skipN = q.skip ? byResp.filter(({ m }) => m[q.id]?.answer === q.skip).length : 0;
      html += distRow(String(n), q.text, mk(q, q.id), distEnds(q), { extra: skipN ? `${q.skip} ${skipN}명` : "" });
      const fuPts = mk(q.fu, q.id + "__fu");
      if (fuPts.length) html += distRow(`${n}-추가`, q.fu.text, fuPts, distEnds(q.fu), { fu: true, neutral: q.fu.type === "money" || q.fu.type === "people" });
      else html += `<div class="drow dfu empty-fu"><div class="dq"><span class="dn">${n}-추가</span><span class="dt">${esc(q.fu.text)}</span><span class="dc">열린 사람 없음</span></div></div>`;
    });
    html += `</section>`;
  }
  return html;
}

function adminShell(inner) {

let authReady = FB_OK ? new Promise(res => { const off = fauth.onAuthStateChanged(() => { off(); res(); }); }) : Promise.resolve();

    document.getElementById("back").addEventListener("click", backToSurvey);
    document.getElementById("login-form").addEventListener("submit", async e => {

      if (!id.includes("@")) id = id + "@" + ADMIN_ID_DOMAIN;
      try { await fauth.signInWithEmailAndPassword(id, pw); renderAdmin(); }
      catch (err) { st.className = "status bad"; st.textContent = "아이디나 비밀번호가 맞지 않아요. 다시 확인해 주세요."; }
    });

  }
  adminShell(`<p class="empty">응답을 불러오는 중이에요.</p>`);
  try {
    const snap = await fdb.collection("responses").orderBy("createdAt", "desc").get();

  } catch (e) {
    adminShell(`<p class="empty">이 아이디는 응답을 볼 권한이 없어요. 제작팀 아이디로 다시 들어와 주세요.</p>
      <div class="bar"><button class="btn" id="back" type="button">설문으로 돌아가기</button>
      <button class="btn" id="logout" type="button">로그아웃</button></div>`);
    document.getElementById("back").addEventListener("click", backToSurvey);
    document.getElementById("logout").addEventListener("click", async () => { await fauth.signOut(); renderAdmin(); });

  }
  const cols = columns();

  const byId = r => Object.fromEntries((r.rows || []).map(x => [x.id, x]));
  const sums = summaryCols();
  const body = RESP.map(r => {
    const m = byId(r);
    return `<tr><td><button class="who" type="button" data-code="${esc(r.code)}">${esc(r.nickname || "(이름 없음)")}</button></td><td>${esc(r.code)}</td><td>${esc(fmtTime(r.createdAt))}</td><td>${esc(r.open?.taste || "")}</td><td>${esc(r.open?.habit || "")}</td><td>${esc(r.open?.person || "")}</td>${cols.map(c => {
      const x = m[c.id];
      if (!x) return `<td class="none">·</td>`;
      const sc = x.score ?? x.value;
      if (isNumeric(c.id)) return `<td><span class="big">${sc ?? "·"}</span><span class="small">${esc(x.answer)}</span></td>`;
      return `<td><span>${esc(x.answer)}</span>${sc != null ? `<span class="small">${sc}</span>` : ""}</td>`;
    }).join("")}</tr>`;
  }).join("");
  adminShell(`
    <div class="bar"><span class="count">응답 ${RESP.length}개</span>
      <button class="btn" id="back" type="button">설문으로 돌아가기</button>

    <div class="bar" id="reset-confirm" hidden style="background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px">
      <span class="count" style="color:var(--ink)">응답 ${RESP.length}개를 모두 지울까요? 지운 응답은 되돌릴 수 없어요. 필요하면 먼저 스프레드시트로 받아 두세요.</span>
      <button class="btn" id="reset-cancel" type="button">취소</button>
      <button class="btn" id="reset-go" type="button" style="background:var(--warn);border-color:var(--warn);color:#fff">모두 지우기</button>
    </div>
    <p class="status" id="csv-status"></p>
    ${RESP.length ? `<div class="vtabs" role="tablist"><button type="button" class="vtab" id="tab-table" aria-selected="${ADMIN_TAB === "table"}">표로 보기</button><button type="button" class="vtab" id="tab-dist" aria-selected="${ADMIN_TAB === "dist"}">분포로 보기</button></div>
    <div id="dist-view" ${ADMIN_TAB === "dist" ? "" : "hidden"}>${distHTML()}</div>
    <div class="tablewrap" id="table-view" ${ADMIN_TAB === "table" ? "" : "hidden"}><table class="resp"><thead><tr><th>닉네임</th><th>응답 번호</th><th>제출 시각</th><th>취향</th><th>비밀 습관</th><th>영향을 준 사람</th>${cols.map(c => `<th class="${c.fu ? "fu" : ""}" title="${esc(c.title)}">${c.head}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`
      : `<p class="empty">아직 제출된 응답이 없어요. 설문을 끝까지 답하고 제출하면 여기에 한 줄씩 쌓여요.</p>`}`);
  document.getElementById("back").addEventListener("click", backToSurvey);

    document.getElementById("tab-table").setAttribute("aria-selected", t === "table"); document.getElementById("tab-dist").setAttribute("aria-selected", t === "dist"); };
  document.getElementById("tab-table")?.addEventListener("click", () => setTab("table"));

  document.getElementById("csv").addEventListener("click", saveCSV);

  const rc = document.getElementById("reset-confirm");

  document.getElementById("reset-cancel").addEventListener("click", () => { rc.hidden = true; });
  document.getElementById("reset-go").addEventListener("click", async () => {

    go.disabled = true; go.textContent = "지우는 중";

}
function saveCSV() {
  const cols = columns();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["닉네임", "응답 번호", "제출 시각", "취향(초성)", "비밀 습관(초성)", "영향을 준 사람(초성)"];
  cols.forEach(c => { head.push(`${c.head} 답`, `${c.head} 점수`); });
  const sums = summaryCols();
  sums.forEach(sc => head.push(`[평균] ${sc.head}`));
  const lines = [head.map(q).join(",")];
  const qrow = ["", "", "", "", "", ""];
  cols.forEach(c => { qrow.push(c.title, ""); });
  sums.forEach(() => qrow.push("기본 질문 점수 평균"));
  lines.push(qrow.map(q).join(","));
  RESP.forEach(r => {
    const m = Object.fromEntries((r.rows || []).map(x => [x.id, x]));
    const row = [r.nickname || "", r.code, r.createdAt, r.open?.taste, r.open?.habit, r.open?.person];
    cols.forEach(c => { const x = m[c.id]; row.push(x ? x.answer : "·", x ? (x.score ?? x.value ?? "") : "·"); });
    sums.forEach(sc => row.push(summaryValue(m, sc) ?? ""));
    lines.push(row.map(q).join(","));
  });
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `N_unit_설문_응답_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function route() {
  if (location.hash === "#responses") renderAdmin();
  else { document.getElementById("rail").hidden = false; renderStage(); }
}
window.addEventListener("hashchange", route);
route();
